<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Amazon Bedrock RAGサンプルアプリ</title>
<script type="text/javascript" src="https://code.jquery.com/jquery-2.2.4.min.js"></script>

<script type="text/javascript">
    $(function(){
        $("#response").html("Bedrockからの回答がここに表示されます");

        $("#button").click( function(){
            $("#response").html("ナレッジベースに問い合わせしています");
            // ここのURLはAPIのデプロイ時に表示されるURL（後述）に差し替える
            var url = "https://XXXXXXXX.execute-api.us-west-2.amazonaws.com/prod";
                var JSONdata = {
                    "key1": $("#text").val()
                };
            $.ajax({
                type : 'post',
                url : url,
                data : JSON.stringify(JSONdata),
                contentType: 'application/json',
                dataType : 'json',
                scriptCharset: 'utf-8',
                success : function(data) {
                    $("#response").html(data);
                },
                error : function(data) {
                    // Error
                    alert("error");
                    alert(JSON.stringify(data));
                    $("#response").html(JSON.stringify(data));
                }
            });
        })
    })
</script>
</head>
<body>
    <h1>Amazon Bedrock RAGサンプルアプリ</h1>
    <p>このアプリケーションはナレッジベースの情報をもとに回答します</p>
    <p>入力テキスト: <input type="text" id="text" size="100" placeholder="Amazonデバイスについて質問してください"></p>
    <p><button id="button" type="button">送信</button></p>
    <textarea id="response" cols=120 rows=10 disabled></textarea>
</body>
</html>
